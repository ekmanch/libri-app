<title>Libri Design Mockup - Play</title>
<!--
  Libri Design Mockup - Play
  A play-only copy of the Libri design canvas, for clicking through and as a build reference.

  How this file is organized (for anyone reading the source, including Claude Code):
  - The mockup has 7 screens. Each is a <template data-file="NAME.dc.html"> near the end of this file.
    A screen holds all of its states: every sheet, dialog, menu and sub-page is a section of the
    screen's markup (an <sc-if> per state, with its own {{key.*}} values and logic class), and the
    screen's own Component keeps a stack of what is open. "start" in its settings picks the state
    to open at. Inside each template:
      <x-dc> ... </x-dc>   the screen's markup (390 x 844 phone screen, inline styles).
                            {{name}} holes, <sc-for list="{{items}}" as="x"> loops and
                            <sc-if value="{{flag}}"> conditions are filled from renderVals().
      <script type="text/x-dc" data-dc-script data-props='...'>
                            class Component extends DCLogic { renderVals() { ... } }
                            Mock data and interactions. data-props lists the screen's
                            settings (Tweaks) and their defaults.
  - The META block holds the screen list, each screen's states and the design notes (the rules)
    that sit beside it on the canvas, each tied to the state it is about.
  - The small runtime below renders the templates with Preact. It is only for this viewer.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&amp;family=JetBrains+Mono:wght@400&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
/* Layout: screen list on the left, the phone in the middle, notes and settings on the right. Stacks on narrow screens. */
:root {
  --bg: #0F1012;
  --panel: #17191C;
  --raised: #1F2225;
  --line: #2A2D31;
  --fg: #EEF0F2;
  --muted: #A3A8AE;
  --accent: #F8B289;
  --on-accent: #17120E;
  --font-display: 'Figtree', system-ui, sans-serif;
  --font-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font-body); overflow: hidden; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); }

.top { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--bg); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex-shrink: 0; }
.brand h1 { margin: 0; font: 800 18px/1.2 var(--font-display); letter-spacing: -0.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { padding: 3px 10px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; flex-shrink: 0; }
.top .count { margin-left: auto; color: var(--muted); font-size: 13px; white-space: nowrap; }
.picker { display: none; }

.body { min-height: 0; display: grid; grid-template-columns: 280px minmax(0, 1fr); }

.side { overflow-y: auto; border-right: 1px solid var(--line); padding: 8px 10px 32px; }
.side h2 { margin: 18px 10px 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.side button { width: 100%; display: flex; gap: 10px; align-items: baseline; padding: 8px 10px; border: 0; border-radius: 10px; background: none; text-align: left; cursor: pointer; }
.side button:hover { background: var(--raised); }
.side button[aria-current="true"] { background: var(--raised); box-shadow: inset 0 0 0 1px var(--line); }
.side .code { flex-shrink: 0; width: 34px; font: 500 12px/1.4 var(--font-mono); color: var(--accent); }
.side .name { min-width: 0; font-size: 14px; line-height: 1.35; }
.side button.scr { align-items: center; }
.side button.scr .name { flex: 1 1 auto; font-size: 15px; font-weight: 600; }
.side button.scr .n { font: 500 12px/1 var(--font-mono); color: var(--muted); }
.more { margin-top: 4px; }
.more summary { cursor: pointer; color: var(--muted); font-size: 13px; padding: 6px 0 10px; }
.side .grp-row > button[data-file] { flex: 1 1 auto; min-width: 0; }
.side .grp-toggle { flex: 0 0 auto; width: auto; gap: 4px; align-items: center; padding: 6px 8px; color: var(--muted); font: 500 12px/1 var(--font-mono); }
.side .grp-toggle svg { transition: transform .15s; }
.side .grp[data-open="true"] .grp-toggle svg { transform: rotate(90deg); }
.side .grp-kids { display: none; margin: 2px 0 6px 14px; padding-left: 8px; border-left: 1px solid var(--line); }
.side .grp[data-open="true"] .grp-kids { display: block; }
.side button.kid { padding: 6px 10px; }
.side button.kid .name { font-size: 13px; color: var(--muted); }
.side button.kid[aria-current="true"] .name { color: inherit; }

.main { min-width: 0; overflow-y: auto; display: flex; flex-wrap: wrap; align-items: flex-start; }
.stage { flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px 16px 32px; }
.toolbar { width: 100%; max-width: 560px; display: flex; align-items: center; gap: 8px; }
.toolbar .title { flex: 1 1 auto; min-width: 0; text-align: center; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbtn { height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--line); background: var(--panel); display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 14px; flex-shrink: 0; }
.tbtn:hover:not(:disabled) { border-color: var(--muted); }
.tbtn:disabled { opacity: 0.4; cursor: default; }

.phone-box { position: relative; flex-shrink: 0; }
.phone { position: absolute; left: 0; top: 0; width: 390px; height: 844px; transform-origin: 0 0; border-radius: 36px; overflow: hidden; background: #131416; box-shadow: 0 0 0 1px var(--line), 0 24px 60px rgba(0, 0, 0, 0.55); }
.phone-screen { width: 390px; height: 844px; position: relative; overflow: hidden; }
.screen-error { padding: 24px; color: #FF8A8A; font-size: 14px; }

.info { flex: 0 1 360px; min-width: 0; box-sizing: border-box; padding: 24px 20px 40px; display: flex; flex-direction: column; gap: 22px; }
.info h2 { margin: 0; font: 800 22px/1.2 var(--font-display); letter-spacing: -0.03em; text-wrap: balance; }
.info .file { margin-top: 6px; font: 400 12.5px/1.4 var(--font-mono); color: var(--muted); }
.info h3 { margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.note { margin: 0 0 10px; padding: 12px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-size: 14px; line-height: 1.5; }
.empty { margin: 0; color: var(--muted); font-size: 14px; }
.tweak { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.tweak label { font-size: 13px; color: var(--muted); }
.tweak select, .tweak input[type="text"], .tweak input[type="number"] { height: 40px; box-sizing: border-box; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); padding: 0 10px; max-width: 100%; }
.tweak input[type="color"] { width: 56px; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 2px; }
.check { flex-direction: row; align-items: center; gap: 10px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.hint { margin: 0; font-size: 13px; color: var(--muted); }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 10px 16px; border-radius: 12px; background: var(--raised); border: 1px solid var(--line); font-size: 14px; }
.boot-error { padding: 24px; color: var(--muted); }

@media (max-width: 1100px) {
  .info { flex: 1 1 100%; max-width: 640px; margin: 0 auto; padding-top: 0; }
}
@media (max-width: 760px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }
  .top { flex-wrap: wrap; padding: 12px 16px; }
  .top .count { display: none; }
  .picker { display: block; flex: 1 1 100%; width: 100%; min-width: 0; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); padding: 0 10px; max-width: 100%; }
  .body { display: block; }
  .side { display: none; }
  .main { overflow: visible; }
  .stage { padding-inline: 16px; }
  .info { padding-inline: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

(function () {
  var META = {"order": ["Library.dc.html", "Entry.dc.html", "Show.dc.html", "Music.dc.html", "Plans.dc.html", "Settings.dc.html", "FirstRun.dc.html"], "screens": {"Library.dc.html": {"title": "Library", "labels": {"X-Rating.dc.html": "Rating picker", "Lib-Delete.dc.html": "Delete confirmation", "X-Sort.dc.html": "Sort menu", "Lib-TagList.dc.html": "Filter: all Authors", "X-Conflict.dc.html": "Conflict: keep which copy?", "Main.dc.html": "Home", "X-Light.dc.html": "Home, light theme", "Lib-SeeAll.dc.html": "Movies, text view", "Lib-MoviesList.dc.html": "Movies, list with covers", "Lib-MoviesGrid.dc.html": "Movies, grid with covers", "Lib-SeriesKfpPage.dc.html": "Series page (from a series row)", "Lib-SeriesLotrBooks.dc.html": "Book series after the automatic rules", "Lib-SeriesMine.dc.html": "Series page: hidden parts", "Lib-SeriesMenu.dc.html": "Series page: choose what to show", "Lib-MoviesDone.dc.html": "Movies + Done (filter result)", "Lib-Music.dc.html": "Music: artists, text view", "Lib-MusicList.dc.html": "Music: artists, list with photos", "Lib-MusicGrid.dc.html": "Music: artists, grid with photos", "Lib-MusicAlbums.dc.html": "Music: albums (filter result)", "Lib-MusicSongs.dc.html": "Music: songs (filter result)", "Lib-MusicView.dc.html": "View menu open", "Lib-Search.dc.html": "Search", "Lib-Filter.dc.html": "Filter sheet", "Lib-FilterType.dc.html": "Filter sheet from Movies (Done picked)", "Lib-FilterClint.dc.html": "Filter: Clint Eastwood as director", "Lib-Details.dc.html": "Entry details", "Lib-DetailsTwoCat.dc.html": "Entry details: tag in two categories", "Lib-BookDetails.dc.html": "Book details (page count)", "Lib-SeriesLotr.dc.html": "Movie in a series (The Lord of the Rings)", "Lib-SeriesBerserk.dc.html": "Book in a long series (Berserk 43)", "Lib-SeriesAll.dc.html": "All volumes in a series", "Lib-AddToPlan.dc.html": "Add to plan", "Lib-Empty.dc.html": "Empty states", "Lib-Sync.dc.html": "Sync and errors", "Lib-SyncConflict.dc.html": "Sync conflict banner", "X-TokenExpiry.dc.html": "Token expires soon", "Lib-RailYear.dc.html": "Long list: rail by release year", "Lib-RailAdded.dc.html": "Long list: rail by newest added", "Lib-RailMusic.dc.html": "Long list: music artists A–Z", "Lib-GridYear.dc.html": "Long grid: fast-scroll thumb", "Lib-ResultsSingle.dc.html": "Filtered results, one type", "Lib-ResultsMulti.dc.html": "Filtered results, several types"}, "notes": [{"text": "How this mockup works: there are 7 screens. Sheets, menus and dialogs open on top of the screen you are on, and closing them brings you back to where you were. Every state can also be opened directly with \"Start at\" in Tweaks (Screen settings in Play). Links to another screen (Plans, Settings, an artist, the entry form) open that screen on the right state.", "state": null}, {"text": "Picking a type chip IS the type view: segments, count, sort and view appear right under the chips, and the plan card hides. On All, tap a heading (MOVIES ›) to jump to that type. Back returns to All, and so does tapping Library in the bottom pill, from any type view (like Plans returns to the plan overview). No separate See all screen. The view button opens a small menu (Library › View menu open); pick Text, List or Grid. Music keeps its Artists / Albums / Songs segments; the artist list gets the index rail in text and list view and the fast-scroll thumb in grid view.", "state": "Main.dc.html"}, {"text": "Sorting is strict: \"Newest added\" orders by date added only, with no grouping by status. The two-row preview per type on the home screen is separate. Sort labels everywhere use the sort menu's wording (Library › Sort menu), for example \"Year, oldest first\".", "state": "Lib-SeeAll.dc.html"}, {"text": "Rating, highest first: 10 at the top, then down to 1; unrated entries go last; ties sort by title. With this sort, the index rail's sections are the ratings (10, 9, 8 … Unrated), only the ones that exist. Music albums and songs sort by their own rating; the artist list has no sort menu.", "state": "X-Sort.dc.html"}, {"text": "Grid captions show the year only, never the status (\"Not released yet\" when there is no year). Done shows as the check on the cover's corner. Music grids show the artist instead.", "state": "Lib-MoviesGrid.dc.html"}, {"text": "\"Various Artists\" is pinned at the very end of the artist list, after Z. Artists starting with \"The\" are sorted by the next word. The counts are example numbers.", "state": "Lib-Music.dc.html"}, {"text": "The colored circles and squares are placeholders for real artist photos and album covers.", "state": "Lib-MusicList.dc.html"}, {"text": "View menu labels: \"List/Grid with covers\" for Movies, Shows, Books, Games, Anime and music Albums; \"List/Grid with photos\" for music Artists and Songs. Songs tab: every row reads \"Artist · Year\" (the song's year, or its album's), rated album tracks included. Tapping a song opens its album card.", "state": "Lib-MusicView.dc.html"}, {"text": "Type colors. Dark theme: Movies #F2B544, Shows #7FB7FF, Books #8FD694, Games #FF8F7A, Music #C4A7FF, Anime #FF8CC1. Light theme: Movies #A87C00, Shows #0074DC, Books #01872C, Games #D63A1F, Music #7C3AED, Anime #C8157E. Light colors are as colorful as they can be while readable; all reach 4.5:1 (AA) on white, except Movies (3.8:1, kept on purpose so gold stays gold). Games is a coral red in both themes (same hue). Section headings and type-chip dots use the color for the current theme. In the light theme, accent-colored text, icons and outlines on white (links like \"Clear all\", \"Rate\", done checkmarks) use the accent's darker ink from Settings, for example #D6337F for Hot pink. Every ink reaches 4.5:1 on white; the pastel ones are darkened versions of the Catppuccin Latte colors. The light theme works like the dark one: same chips, type views, view menu, rail and scrolling. Switch \"theme\" in Tweaks to see any Library state in light.", "state": "X-Light.dc.html"}, {"text": "All search boxes share one style: gray outline, magnifier icon, accent outline while typing (Library › Search). Inside sheets the fill is one step darker so the box stands out from the sheet. Placeholder and hint text: #8A8F96 on dark, #6B7079 on light (about 5:1).", "state": "Lib-Search.dc.html"}, {"text": "Filter sheet and home stay in sync. Opening the sheet from a type view preselects that type and its status segment (Library › Filter sheet from Movies: Movies + Done). If the filter is no more than one type plus at most one status, the home shows that type view with the status segment picked (Library › Movies + Done), not a results screen. Anything more (several types or statuses, a decade, a tag) opens results (Library › Filtered results). With nothing picked, the home goes to All. \"Clear all\", \"Clear filters\" and Reset clear the type too, so you land on All. Status chips follow the chosen types: Movies have Want, Done, DNF; Music (albums and songs) has Want and Done; Shows, Books, Games and Anime have all four. A status that no longer applies is dropped. Kind: when Music is among the chosen types, a Kind group (Albums, Songs) appears under Status; it matches the \"kind\" field and only narrows music entries. For Music, Kind plays the role the status segment plays for other types: Music alone opens the Music view on Artists, Music + Songs on Songs, Music + Albums on Albums. Music + a status goes to results, since the Music view has no status segment. Artists is a way of browsing, not a filter, so it never appears on the sheet. Try the other presets via \"preset\" in Tweaks.", "state": "Lib-FilterType.dc.html"}, {"text": "If the filter is only one type, with at most one status, don't show a results screen: show that type's view with the status segment picked (Library › Movies + Done). A results screen appears only when there is something more, such as a tag, a decade, or a second status.", "state": "Lib-ResultsMulti.dc.html"}, {"text": "Touch targets: chips keep their drawn size (40 dp for tag, platform and suggestion chips) but each gets a 48 dp touch area. Bottom nav items and segmented controls are 48 dp tall, and every segment is at least 48 dp wide.", "state": "Lib-Filter.dc.html"}, {"text": "Index rail, when to show it: the list is at least 3 screens tall AND has at least 2 sections (keep the screen count as one named constant). Short lists get nothing. Text and list views get an index rail; grid view gets a slim fast-scroll thumb with a small neutral label instead (Library › Long grid). The rail follows what is on screen: in a type view or results with one type, the sections of the current sort (decades, months added, letters). In results with several types, one colored dot per type group, using the type colors. Only sections that exist, spread over the full height; tap or drag to jump; current one highlighted; list dividers stop before the rail. Not used in search, plans or one artist's page.", "state": "Lib-RailYear.dc.html"}, {"text": "Cover or photo spot in details (Library › Entry details, Music › Album, Plans › Entry details): shown only when that type's view is \"List/Grid with covers\" or \"List/Grid with photos\". Hidden in Text view (\"showCover\" in Tweaks).", "state": "Lib-Details.dc.html"}, {"text": "Series (books, movies, games, anime movies): an entry can be part of a series, stored on the entry as \"series\": {\"name\": \"The Lord of the Rings\", \"number\": 1}. Details then gets a Series section after Rating, like Seasons on a show: the series name, \"2 of 3 in your library\", and the parts in the series' own order (the source's numbering, usually story order). This one is highlighted; parts in your library show their status and open their own details; missing ones are grayed with \"+ Add\", which starts a new entry looked up for that title. Up to 5 parts are all listed. With more, the one before, this one and the one after are shown (the first three when this is the first, the last three when it is the last). Seasons show the latest three instead, because you are usually on the newest season; in a series you can be anywhere, then \"All 43 volumes ›\" opens the full list, scrolled to this one. With the section the sheet opens full height and scrolls, like a show's. Note, About, tags, plans, Edit and Delete stay as they are. Where the series comes from: movies from TMDB collections, games from IGDB collections, books from Wikidata (part of the series + series ordinal), then Open Library; manga volume numbers can also be read from the title (\"Vol. 43\"). The full list of parts is fetched and cached on the phone, like episodes; only name and number are stored. Series and Number are editable in the entry form (filled in from the lookup when known). Shows and anime series use seasons instead. Wikidata gets a row in About. Years and Berserk details in the mockup are sample data.", "state": "Lib-SeriesLotr.dc.html"}, {"text": "Cleaning up a series automatically: the source's list of parts can hold things you never want to see. Wikidata's The Lord of the Rings has 11: the three books, a six-book edition (The First Journey … The End of the Third Age), the Appendices and the prologue Concerning Hobbits. Rules run when the parts are fetched, with no taps: 1) drop a part that is itself \"part of\" another part of the same series (P361; the six-book split); 2) drop parts with no number and no date (Concerning Hobbits); 3) drop parts whose type (P31) differs from the series' main parts: keep novels/books/films, drop appendices, guides, prologues and the like (the Appendices). Result: 3 books, as shown here. A main part you don't have yet (The Return of the King) is never dropped; it shows with \"+ Add\". The Hobbit and The Silmarillion are separate entries, not part of this series.", "state": "Lib-SeriesLotrBooks.dc.html"}, {"text": "Hiding parts by hand (fallback): for parts the rules keep but you don't care about, e.g. the Dune books by Brian Herbert and Kevin J. Anderson. The ⋮ menu on the series page has \"Choose what to show\": a sheet listing the parts not in your library (number, year, and the creator when it differs from the series'), all ticked; untick and Done. Parts in your library (any status, Want included) always show, so this never hides an entry. Hidden parts are left out of the counts (\"6 books · 3 in your library\") and the details sheet's Series section; a quiet \"2 hidden parts · Show\" row at the end of the series page peeks at them. Parts the series gets later show until you hide them. Stored on the phone per series (the hidden parts' source ids), like the view mode; not in library.json. The ⋮ menu also holds Series cover (was a Cover button). Dune details in the mockup are sample data.", "state": "Lib-SeriesMine.dc.html"}, {"text": "Series in the library list: in a long type list, the parts of a series that are in your library show as one row. Long means the list would be at least 3 screens tall, the same constant as the index rail (about 30 rows in text view); the mockup treats every type list as long. Grouped when the status segment is All, Done or DNF; Want and In progress always show the single entries (you're picking what to watch next). Search always shows single entries; filter results follow the same long-list rule. A series needs at least 2 parts in the library to group; with one part (The Mummy) it stays a normal row. The row: the series name (TMDB's \"Collection\" suffix dropped), a stack icon with \"4 movies · 2008–2024\", and \"2 of 4 done\" (a check when all are done). In list and grid views it shows one cover with a small stack badge and the count. The cover is part 1's by default; Series cover in the series page's ⋮ menu lets you pick another part in your library (stored on that entry: \"series\": {\"name\", \"number\", \"cover\": true}). Sorting: a series sits where its first-sorting part would (Newest added: the part added last). The count line still counts entries (\"14 movies\"), not rows. Tapping the row opens the series page (pushed, like All seasons): every part in order, status pills, \"+ Add\" for missing parts. Tapping a part opens its details sheet; closing it returns to the page. Plans are never grouped.", "state": "Lib-SeriesKfpPage.dc.html"}, {"text": "Page count (books): shown in details under the author (\"160 pages\"). Stored as \"pages\": 160. Fetched when the book is added (Open Library, with Google Books as fallback), and editable in the entry form, where books get a Pages field. If no count is known, the line is left out.", "state": "Lib-BookDetails.dc.html"}, {"text": "Destructive buttons everywhere: no fill, gray outline, red text #FF6B6B (entry details, delete and remove dialogs, album details, plan delete, disconnect, the album/song replace dialogs, All Halloween, Edit plan). The safe choice next to it keeps its own style.", "state": "Lib-Delete.dc.html"}, {"text": "Conflict: the library changed on GitHub and on this phone since they last matched (also after a disconnect where the phone kept its copy and either side, or both, was edited). Syncing stops and nothing moves until a choice. Banner on Library and Plans: \"Changed here and on GitHub · Pick which copy to keep.\" with Choose. Settings › Library connection while unresolved: red dot, \"Changed here and on GitHub\", second line \"Pick which copy to keep\", Sync now replaced by Choose (\"syncState\" in Settings Tweaks). Keep which copy? opens from the banner and from the connection screen: two muted lines (This phone: N changes, GitHub: last commit date) and one warning: \"Whichever you keep, the other copy's changes are gone. Earlier versions stay in the repo's history.\" Keep mine (neutral fill): the phone's copy replaces GitHub's. Keep GitHub's (destructive): GitHub's copy replaces the phone's and the queued changes are dropped. Decide later (text): closes, the banner stays, nothing syncs until a choice.", "state": "X-Conflict.dc.html"}, {"text": "Token expiry: GitHub sends a GitHub-Authentication-Token-Expiration header on every API response made with a token that has an expiry date. Libri saves the date from its normal sync calls (no extra request). Value looks like \"2025-11-10 16:20:42 +0500\". Ignore a date that is not in the future while calls still succeed (GitHub briefly sent the current time instead in Sept 2025). From 7 days before, the dialog shows once a day, the first time Libri opens that day. Later closes it until the next day; Replace token opens the token step of setup (First run › Connect GitHub) with the repo kept; Open GitHub opens the token settings page in the browser. A token with no expiry never sends the header, so nothing is shown. Once it has expired, GitHub answers 401 and the sync row says \"Token expired\" with Replace token.", "state": "X-TokenExpiry.dc.html"}, {"text": "Type: one family, Figtree, everywhere. Screen titles, plan names and dialog titles use Figtree ExtraBold (800) with letter spacing -0.03em; sizes stay as drawn (34 for main titles, 30 for setup titles, 28 for sub-screens, 22 for dialogs and plan cards). Body text is Regular (400), labels and buttons SemiBold (600). Bricolage Grotesque is no longer used.", "state": null}]}, "Entry.dc.html": {"title": "Add / edit entry", "labels": {"X-Rating.dc.html": "Rating picker", "Lib-Delete.dc.html": "Delete confirmation", "X-Sort.dc.html": "Sort menu", "Lib-TagList.dc.html": "All tags in a group", "X-Conflict.dc.html": "Conflict: keep which copy?", "Lib-Match.dc.html": "New entry: pick a match", "Lib-MatchPlatform.dc.html": "Game search on a platform", "Lib-MatchPlatformPick.dc.html": "Platform picker", "Lib-Edit.dc.html": "New game from a match", "Lib-EditEbook.dc.html": "Book: year from the ebook edition", "Lib-Released.dc.html": "Released: wheel picker", "Lib-ReleasedType.dc.html": "Released: type the year", "Lib-TagPick.dc.html": "Tag picker", "Lib-EditTwoCat.dc.html": "Tag in two categories: entry form", "Lib-TagPickTwoCat.dc.html": "Tag in two categories: tag picker", "Lib-EditCover.dc.html": "Cover from another match", "Lib-EditCoverPick.dc.html": "Pick a cover", "X-TagSimilar.dc.html": "New tag: a similar one exists", "X-TagCreate.dc.html": "New tag: confirm and pick a category", "Lib-EditShow.dc.html": "Edit a show", "X-ReplaceSongs.dc.html": "Saving an album: songs already saved", "X-ReplaceAlbum.dc.html": "Saving a song: album already saved"}, "notes": [{"text": "Top banner when a match was used: \"Details fetched online\"; no source names (IGDB etc.) in the UI. Platforms (games): the chips are the platforms the game came out on (fetched); the selected ones are where you play or want to play it. Multi-select, saved as a list. \"Other…\" lets you type one that isn't listed. Your default platform from Settings (PC here) is pre-selected when the game came out on it; otherwise nothing is pre-selected. Tags: the selection box shows the chosen tags; tapping it opens the tag picker. Under the box, up to 6 suggestions fetched online. Ones that match tags you already use start in the box; new ones are dashed, marked \"new\" and stay below until tapped (tapping counts as the confirm and moves them into the box). Fetched names are cleaned up first: spelling fixed against your tags (\"horor\" → #horror), turned into tag form (\"Postapocalypse\" → #post-apocalyptic), duplicates merged. The picker lists your existing tags grouped by category, plus any new tags added on this entry so they can be removed; typing filters them, and \"Create …\" only appears when nothing matches exactly (then the new-tag dialogs). Edit mode: switch \"mode\" in Tweaks.", "state": "Lib-Edit.dc.html"}, {"text": "Released field: tapping it opens a sheet with three wheels: Year, Month, Day. Month and Day start with \"—\" (not set), so the value can be a year, a year and month, or a full date, matching the three formats of `released`. The Day wheel only lists days that exist in the chosen month, and stays on \"—\" until a month is picked. The wheels open on the current value (usually filled in by the online lookup), otherwise on the current year. The year wheel covers 1800 to five years ahead. Tap the centered year to type it on the number keypad, for anything older such as a Dickens novel; any year can be typed. Clear (next to Done) removes the date completely: the sheet closes and the field reads \"Not set\" in gray. Reopening starts the wheels on the current year; turning any wheel or typing a year sets a date again. The field shows \"2013\", \"Jun 2013\" or \"Jun 14, 2013\"; it's now wider, so the date never clips.", "state": "Lib-Released.dc.html"}, {"text": "Tag categories: Genres (movies, shows, books, anime), Game genres, Music genres, Mood (all types), Season, Languages, Authors, Directors (also showrunners and anime directors), Actors (movies and shows), Studios (game and animation studios), Streaming (movies and shows), Animation style, Other. Every tag belongs to at least one category, picked when it is created (people and genre tags can have several; see the note on tags in more than one category). A creator tag's category is the person's main role, not the entry's type: #stephen-king is in Authors even on a movie. Filtering is always by tags. When an entry's creator field is filled, the entry form suggests the matching tag (#naughty-dog), marked new, like any other suggestion. For movies and shows, it also suggests actor tags for the top 3 billed cast from TMDB (#kate-siegel), marked new the same way; never more than 3. Tags are sorted A–Z by the tag itself in every group, so people sort by first name (#ray-bradbury under R, #stephen-king under S), and a leading \"The\" is ignored. Group size rule (Library › Filter sheet and the tag picker): a group with up to 24 tags is a folding row with its chips inside; a group with 25 or more tags is a link row, \"Authors · 64 authors · 1 selected ›\", that opens a full-screen list (Library › Filter: all Authors) with search, letter sections and the index rail (same rule as other lists: at least 3 screens and 2 sections). 24 chips is about 8 rows, half a screen, the most worth scanning by eye. A group switches to the list on its own when it grows past 24. Filter sheet: a group shows only when at least one of its tags is used by an entry of the chosen types (all groups when no type is chosen); a selected tag whose group disappears is dropped. Tag picker: every group starts folded each time the picker opens, except groups that already hold a tag on this entry (and \"New on this entry\", always open). Folded rows show \"n selected\". Typing in search shows matches from every group, folded or not. Game genres only for games, Music genres only for music, Actors only for movies and shows, unless you search. Plan linked hashtags (Plans › Edit plan, New plan) list every category. Example: Studios (#studio-ghibli, #rare, #madhouse) shows when Games or Anime are chosen, or nothing; with Movies chosen it shows too, because Soul carries #pixar.", "state": "Lib-TagPick.dc.html"}, {"text": "Ebook year: when a book's year comes only from the iTunes result (no Open Library match), a short hint sits under the Released field: \"Year from the ebook edition. Check if it’s a reprint.\" (12.5 px, gray, wraps to two lines in the field's column). iTunes gives the ebook's own date, so a Dickens novel can show up as 2012. The hint goes away once you change the date, clear it or close the Released picker. It is only shown while adding a book; nothing is saved to library.json, so Edit never shows it.", "state": "Lib-EditEbook.dc.html"}, {"text": "Tags in more than one category: a people tag can be in Authors, Directors and Actors, and a genre tag in Genres, Game genres and Music genres (never across kinds, so #horror can't become an actor; Mood, Season, Studios, Animation style and Other stay one category each). The categories belong to the tag (the tag list); on each entry the tag is ticked per category: Million Dollar Baby has #clint-eastwood under Directors and Actors, The Good, the Bad and the Ugly only under Actors. New tag: pick one or more categories of the same kind; tapping another kind starts over with it. Long-press a tag in the tag picker to change its categories (at least one stays). Searching in the picker for a person or genre that exists in another category of the same kind shows \"+ Add to Directors\": it adds the category and ticks it on this entry. Where a tag with several categories shows as text (the Tags box in the entry form, details, active filters, Library search results), its category follows the name: \"#clint-eastwood · Actor\", \"#sports · Game genre\"; details merge them (\"· Director, Actor\"). Under a group heading (tag picker, filter sheet) no label is needed. One-category tags look as before. Filters work per category: Directors › #clint-eastwood only matches entries where he is ticked as director. The lookup ticks per category (TMDB: director, top-3 cast). Data: \"tags\" stays a flat list of names (the per-tag Markdown and the PDFs keep working). Entries add \"tag_categories\": {\"#clint-eastwood\": [\"Actors\"]}, only for tags that have more than one category in the tag list; the tag list stores each tag's categories as a list.", "state": "Lib-TagPickTwoCat.dc.html"}, {"text": "Languages: its own tag category, after Season (#japanese, #norwegian, #swedish, #german, #spanish, #portuguese), the language the work is in. One category per tag, like Mood. The lookup suggests one from the original language (TMDB, Open Library, IGDB), except English, which nearly everything is in; for anime it skips Japanese for the same reason. Moving tags you put in Other before: long-press the tag in the tag picker and pick Languages; a one-category tag moves and stays on all its entries.", "state": "Lib-TagPick.dc.html"}, {"text": "Streaming: its own tag category for where a show or movie first came out (#netflix, #hbo, #apple-tv, #disney-plus), whether the platform made it or bought it. One category per tag. Only for movies and shows: hidden for books, games, music and anime. Lookup: shows get TMDB's first network, but only when it's a streaming service you already have as a tag (an old show that first aired on ABC gets nothing). Movies only when it's a platform original, i.e. the platform is among TMDB's production companies (a Netflix Original); otherwise it's left empty. Move existing tags out of Other with a long-press in the tag picker.", "state": "Lib-TagPick.dc.html"}, {"text": "Cover from another match: the cover normally comes from the match you picked, so a nicer cover used to mean taking that match's data too (wrong edition, wrong year, a \"Part One\" title that breaks series matching). Now the entry form shows the cover with a small pencil badge; tapping the cover opens \"Pick a cover\" (no separate button): the other matches the lookup finds for the entry's title, covers shown large, each with its title, year and edition (Hardcover, Ebook, TV tie-in; no source names). Picking one changes only the cover; title, year, description, series and source stay. Next to the cover: \"From the match · tap to change\", or after a pick \"From another match\" with \"Use the match's cover\", which puts the default back. Stored as the lookup id the cover comes from, not the image or its URL, right after source, and left out when the cover is the match's own (a proposed new field: it needs your go-ahead, since covers are otherwise kept out of library.json, and the data repo's validator must accept it). Name it \"cover_from\" (\"cover_from\": \"itunes:123456\") so it isn't confused with the series cover flag (\"series\": {..., \"cover\": true}).", "state": "Lib-EditCover.dc.html"}, {"text": "Platform when searching for a game: with the Games chip picked (new entry, or Look up again on a game), a \"Platform · Any ▾\" chip appears under the type chips. It opens a sheet: Any platform, Your platforms (the default from Settings first, then platforms on games in your library), then All platforms A–Z. Each platform lists its other names (Super Nintendo: SNES · Super Famicom · Super Nintendo Entertainment System) and search matches all of them, so \"snes\" or \"genesis\" works. Optional: Any is the default and the × next to the chip clears it. With a platform picked, only games released on it are listed (IGDB release dates per platform), and each shows the year it came out there (Street Fighter II on SNES: 1992, not the 1991 arcade original). Picking a match then pre-selects that platform in the entry's Platforms. Look up again on a game starts with the first of its selected platforms. The platform isn't remembered between searches. Hidden for other types. Game titles and years in the mockup are sample data.", "state": "Lib-MatchPlatform.dc.html"}, {"text": "Edit a show: no Released field. Each season has its release date (same Released picker as other types), a status pill (the same sheet as in details, including \"Mark seasons 1–N Done\") and a remove button; \"Add season\" adds the next number. The Status control is replaced by a read-only row (\"In progress · Set by the seasons\"), except for a show with one season, which keeps the normal Status control and has no pill on Season 1. When adding a show, the seasons from TMDB are listed here, so you can set what you've watched before saving. Changing a season's date here marks that season manual, so the daily check never overwrites it. \"Look up again\" on a show whose seasons are all manual replaces them with TMDB's seasons and keeps each season's status (matched by number). Plans: ticking a show in a plan marks every released season Done; unticking puts the seasons back exactly as they were.", "state": "Lib-EditShow.dc.html"}]}, "Show.dc.html": {"title": "Show & seasons", "labels": {"X-Rating.dc.html": "Rating picker", "Lib-Delete.dc.html": "Delete confirmation", "X-Sort.dc.html": "Sort menu", "Lib-TagList.dc.html": "All tags in a group", "X-Conflict.dc.html": "Conflict: keep which copy?", "Lib-ShowSeasons.dc.html": "Show with seasons (Haunted Hotel)", "Lib-ShowSeasonsNew.dc.html": "New season just out", "Lib-ShowSeasonsLong.dc.html": "Many seasons (South Park)", "Lib-ShowSeasonsAll.dc.html": "All seasons", "Lib-ShowSeasonsAdded.dc.html": "All seasons, just added: catch up", "Lib-ShowSingle.dc.html": "One season (Carrie)", "Lib-ShowAnnounced.dc.html": "Season 2 announced", "Lib-ShowCanceled.dc.html": "Announced season dropped", "Lib-Season.dc.html": "Season episodes (all out)", "Lib-SeasonSP.dc.html": "Season episodes (airing weekly)", "Lib-SeasonCarrie.dc.html": "Episodes of a one-season show", "Lib-ShowFrieren.dc.html": "Anime with seasons (Frieren)", "Lib-SeasonFrieren.dc.html": "Anime season episodes"}, "notes": [{"text": "Seasons (shows): a show is one entry with a list of seasons, fetched from TMDB when it's added: {\"season\": 2, \"released\": \"2026-10-09\", \"status\": \"in progress\"}. Released can be a year, year-month or full date. A season's status is null (Not set), want, in progress, done or dnf. No per-season rating: the show has one rating, like IMDb. Shows have no Released field of their own: the years in the header come from the first and last released season, and sorting by release uses Season 1. Show status is set by the released seasons (ignoring Not set and seasons not out yet): any In progress → In progress; else any DNF → DNF; all Done → Done; some Done and some Want → In progress; all Want or nothing set → Want. Details shows it as a read-only row, \"Status · In progress · from seasons\". The app still writes this status on the show in the JSON so filters, sorting and the export keep working. New seasons: once a day Libri checks TMDB for new seasons of shows not marked DNF. A new season is added as Not set, so the show's status doesn't change; it's marked New in details (New season just out) and gets a \"New season\" badge in the library lists (Library › Home, Wednesday) once its release date has passed. The badge goes away once that season gets a status. Library lists: shows with more than one season show the years and the season count (\"2025–2026 · 2 seasons\").", "state": "Lib-ShowSeasons.dc.html"}, {"text": "Many seasons: up to 5 seasons are all listed in details. With 6 or more (South Park), details shows the latest 3 seasons, then a row \"All 29 seasons ›\" that opens the full list, oldest first, opened scrolled to the season you're on (in progress, else the first one not Done). Catch up: in the season status sheet, when any earlier season isn't Done, a button \"Mark seasons 1–28 Done\" marks every earlier season Done in one tap (All seasons, just added: catch up: South Park just added, tap Season 29). It never changes later seasons. Like any season change, it can change the show's status, since that comes from the seasons.", "state": "Lib-ShowSeasonsLong.dc.html"}, {"text": "One season (Carrie): looks the same as a show with more seasons: the Seasons section lists Season 1 with its date and ›, which opens its episodes. The only difference: Season 1 has no status pill. Instead the Status row at the top is editable (tap the pill), and it sets Season 1's status, which is the show's status. When a second season appears (Season 2 announced), the Status row becomes read-only (\"Done · from seasons\") and each season gets its own pill; Season 1 keeps its status, the new one starts Not set, so the show stays Done. An announced season shows \"Coming 2027\" and gets the New season badge only once it is released. Dropped seasons (Announced season dropped): when an unreleased season Libri added itself is no longer on TMDB, or the show is marked Canceled there, on two daily checks in a row: if it's still Not set, Libri removes it quietly; if you gave it a status, it asks first (Keep it / Remove). Seasons you added in Edit, and seasons already released, are never removed. With one season left, the screen goes back to the one-season layout. Keep it marks the season as manual, so Libri never asks about it again.", "state": "Lib-ShowSingle.dc.html"}, {"text": "Anime: a series works exactly like a show: seasons with their own release date and status, the anime's status set by its seasons, episodes for viewing, the New season badge, the daily check and the many-seasons rules. An anime movie stays like a movie: one Released date, no seasons. The lookup decides which it is and stores it in \"kind\": \"series\" or \"movie\" (AniList format TV or ONA → series, Movie → movie; editable). Seasons and episodes come from TMDB, the same way as for shows, matched to the AniList entry. If TMDB has no match, Libri builds the seasons from AniList's sequel chain (one season per entry, a \"Part 2\" counts as its own season) and episodes show as \"Episode 5\" with their air date. Recaps and specials are left out. Header and lists use the Anime color (#FF8CC1), and lists show \"2023–2026 · 2 seasons\" like shows. Episode titles in the mockup are sample text.", "state": "Lib-ShowFrieren.dc.html"}, {"text": "Episodes are for viewing only: no ticking or rating. Tapping a season row (anything but its status pill) opens the season screen; rows end with ›. The header shows the show, the season and its release date and episode count; the season's status pill sits under it and opens the usual status sheet. Each episode shows its number, title, air date and runtime; when the whole season came out on one day, the date is in the header only and episodes show just the runtime. Episodes not out yet are dimmed with \"Airs Oct 22\", title \"Title TBA\" until TMDB has one. Episodes are fetched from TMDB when a season screen opens and cached on the phone; they are never stored in library.json, and the daily season check doesn't fetch them. Episode titles in the mockup are sample text.", "state": "Lib-Season.dc.html"}]}, "Music.dc.html": {"title": "Music", "labels": {"X-Rating.dc.html": "Rating picker", "Lib-Delete.dc.html": "Delete confirmation", "X-Sort.dc.html": "Sort menu" s its website in the browser (external-link icon, not a chevron). Required credits: TMDB needs an approved logo plus the exact sentence shown; Deezer needs a clearly visible Deezer logo. The dashed boxes mark where the official logo files go (never redrawn). Google Books' About row and link are the credit, since Libri shows no Google search results. IGDB, AniList, Open Library and Wikidata ask for nothing extra; Apple Books' row and link are its credit, like Google Books'.", "state": "X-About.dc.html"}]}, "FirstRun.dc.html": {"title": "First run", "labels": {"X-Rating.dc.html": "Rating picker", "Lib-Delete.dc.html": "Delete confirmation", "X-Sort.dc.html": "Sort menu", "Lib-TagList.dc.html": "All tags in a group", "X-Conflict.dc.html": "Conflict: keep which copy?", "Onb-Splash.dc.html": "Splash", "Onb-Welcome.dc.html": "Welcome", "Lib-Setup.dc.html": "Connect GitHub", "Onb-Branch.dc.html": "Pick a branch", "Onb-File.dc.html": "Library file: new or existing", "Onb-Create.dc.html": "Create a new library", "Onb-Existing.dc.html": "Pick an existing file", "X-Reconnect.dc.html": "Different file: which library?", "Onb-Done.dc.html": "All set", "X-Loading.dc.html": "First load"}, "notes": [{"text": "Only on first launch (or after Disconnect in Settings › Library connection). Start at Welcome to click through the whole flow. Create new: Libri commits an empty version 2 library.json to the repo and opens the empty library (Library › Empty states); it never overwrites an existing file. Use existing: lists the repo's .json files; files not in Libri's format are shown but can't be picked. The app name appears on the splash, the welcome and in Settings › About Libri.", "state": "Onb-Splash.dc.html"}, {"text": "Branch: after Connect, Libri reads every branch in the repo and shows a loading state while it does. The repo's default branch is listed first, tagged Default and preselected; the rest follow A–Z. It's shown even when the repo has only one branch. The pick applies to every     if (!keys.length) { var none = document.createElement('p'); none.className = 'empty'; none.textContent = 'This screen has no settings.'; tw.appendChild(none); }
    var vals = propsFor(s);
    keys.forEach(function (k) {
      var d = s.defs[k], id = 'tw-' + k, row = document.createElement('div'), lab = document.createElement('label'), input;
      row.className = 'tweak'; lab.setAttribute('for', id); lab.textContent = k === 'start' ? 'Start at' : k;
      if (d.editor === 'enum') {
        input = document.createElement('select');
        (d.options || []).forEach(function (op) { var o = document.createElement('option'); o.value = op; o.textContent = op; input.appendChild(o); });
        input.value = vals[k];
      } else if (d.editor === 'boolean') {
        input = document.createElement('input'); input.type = 'checkbox'; input.checked = !!vals[k]; row.className = 'tweak check';
      } else if (d.editor === 'color') {
        input = document.createElement('input'); input.type = 'color'; input.value = vals[k] || '#000000';
      } else if (d.editor === 'int' || d.editor === 'float' || d.editor === 'range') {
        input = document.createElement('input'); input.type = 'number'; input.value = vals[k];
      } else {
        input = document.createElement('input'); input.type = 'text'; input.value = vals[k] == null ? '' : vals[k];
      }
      input.id = id;
      input.addEventListener(d.editor === 'text' ? 'input' : 'change', function () {
        var v = d.editor === 'boolean' ? input.checked : (d.editor === 'int' || d.editor === 'float' || d.editor === 'range') ? Number(input.value) : input.value;
        (overrides[current] = overrides[current] || {})[k] = v;
        mountKey++; mount(); updateChrome();
      });
      if (d.editor === 'boolean') { row.appendChild(input); row.appendChild(lab); } else { row.appendChild(lab); row.appendChild(input); }
      tw.appendChild(row);
    });
    if (keys.length) { var hint = document.createElement('p'); hint.className = 'hint'; hint.textContent = 'Changing a setting restarts the screen at that state.'; tw.appendChild(hint); }
    info.appendChild(tw);
  }

  var box = document.getElementById('phoneBox'), phone = document.getElementById('phone'), stage = document.querySelector('.stage');
  function fit() {
    var narrow = window.matchMedia('(max-width: 760px)').matches;
    var availW = stage.clientWidth - 32;
    var availH = narrow ? Infinity : window.innerHeight - document.querySelector('.top').offsetHeight - 100;
    var sc = Math.max(0.35, Math.min(1, availW / 390, availH / 844));
    phone.style.transform = 'scale(' + sc + ')';
    box.style.width = Math.round(390 * sc) + 'px';
    box.style.height = Math.round(844 * sc) + 'px';
  }
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);
  fit();

  var start = decodeURIComponent((location.hash || '').slice(1));
  go(META.screens[start] ? start : META.order[0], { noPush: true });
})();
</script>
